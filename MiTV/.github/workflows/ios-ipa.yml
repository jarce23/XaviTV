name: Build XaviTV iOS (.ipa)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build XaviTV.ipa (iPhone & iPad)
        working-directory: iosApp
        run: |
          chmod +x build_ipa.sh
          ./build_ipa.sh

      - name: Upload XaviTV.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XaviTV-iOS-IPA
          path: iosApp/build/ipa/XaviTV.ipa
