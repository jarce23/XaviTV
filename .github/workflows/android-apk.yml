name: Build Android (.apk)

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Compilar XaviTV Android (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Release APK (XaviTV.apk)
        run: |
          if [ -f "MiTV/gradlew" ]; then
            cd MiTV
          fi
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Upload XaviTV.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XaviTV-Android-APK
          path: |
            MiTV/app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
