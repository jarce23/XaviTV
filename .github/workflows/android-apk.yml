name: Build Android (.apk)

on:
  push:
    branches:
      - main
    paths:
      - 'MiTV/app/**'
      - 'MiTV/build.gradle.kts'
      - 'MiTV/settings.gradle.kts'
      - 'MiTV/gradle.properties'
      - 'MiTV/gradle/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Compilar XaviTV Android (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Standard and FireTV APKs
        run: |
          if [ -f "MiTV/gradlew" ]; then
            cd MiTV
          fi
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew :app:assembleStandardDebug :app:assembleFireosDebug --no-daemon

      - name: Upload XaviTV-Standard.apk and XaviTV-FireTV.apk Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XaviTV-Android-APK
          path: |
            MiTV/app/build/outputs/apk/standard/debug/XaviTV-Standard.apk
            MiTV/app/build/outputs/apk/fireos/debug/XaviTV-FireTV.apk
          if-no-files-found: error
