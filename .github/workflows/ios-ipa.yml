name: Build iOS (.ipa)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Compilar XaviTV iOS & iPadOS (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build XaviTV.ipa (iPhone & iPad Universal)
        run: |
          if [ -d "MiTV/iosApp" ]; then
            cd MiTV
          fi
          tr -d '\r' < gradlew > gradlew.lf && mv gradlew.lf gradlew
          tr -d '\r' < iosApp/build_ipa.sh > iosApp/build_ipa.sh.lf && mv iosApp/build_ipa.sh.lf iosApp/build_ipa.sh
          chmod +x gradlew iosApp/build_ipa.sh
          cd iosApp
          ./build_ipa.sh

      - name: Upload XaviTV.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XaviTV-iOS-IPA
          path: |
            MiTV/iosApp/build/ipa/XaviTV.ipa
            iosApp/build/ipa/XaviTV.ipa
          if-no-files-found: error
