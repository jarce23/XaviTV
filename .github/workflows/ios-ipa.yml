name: Build iOS (.ipa)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Compilar XaviTV iOS & iPadOS (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Package Kotlin Multiplatform Framework (:shared:linkReleaseFrameworkIosArm64)
        run: |
          if [ -d "MiTV" ]; then
            cd MiTV
          fi
          tr -d '\r' < gradlew > gradlew.lf && mv gradlew.lf gradlew
          chmod +x gradlew
          echo "==> Compilando binario de framework para iOS (arm64)..."
          ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-daemon

          FRAMEWORK_DIR="shared/build/bin/iosArm64/releaseFramework/ComposeApp.framework"
          if [ ! -d "$FRAMEWORK_DIR" ]; then
            echo "ERROR: $FRAMEWORK_DIR no existe"
            exit 1
          fi

          # Exportación directa en iosApp/Frameworks para que Xcode lo resuelva sin ambigüedad
          mkdir -p iosApp/Frameworks
          rm -rf iosApp/Frameworks/ComposeApp.framework
          cp -R "$FRAMEWORK_DIR" iosApp/Frameworks/ComposeApp.framework
          echo "ComposeApp.framework exportado exitosamente en iosApp/Frameworks"

      - name: Install CocoaPods dependencies (MobileVLCKit)
        run: |
          echo "==> Instalando CocoaPods (MobileVLCKit)..."
          if [ -d "MiTV/iosApp" ]; then
            cd MiTV/iosApp
            pod install --repo-update
            mkdir -p Frameworks
            VLC_FW="$(find Pods -name "MobileVLCKit.framework" -type d 2>/dev/null | grep -E "ios-arm64[^/]*|MobileVLCKit\.framework$" | head -n 1 || true)"
            if [ -z "$VLC_FW" ]; then
              VLC_FW="$(find Pods -name "MobileVLCKit.framework" -type d 2>/dev/null | head -n 1 || true)"
            fi
            if [ -n "$VLC_FW" ] && [ -d "$VLC_FW" ]; then
              echo "==> Copiando MobileVLCKit.framework a Frameworks/..."
              rm -rf Frameworks/MobileVLCKit.framework
              cp -R "$VLC_FW" Frameworks/MobileVLCKit.framework
              echo "MobileVLCKit.framework copiado exitosamente en MiTV/iosApp/Frameworks/"
            fi
            cd ../..
          else
            cd iosApp
            pod install --repo-update
            mkdir -p Frameworks
            VLC_FW="$(find Pods -name "MobileVLCKit.framework" -type d 2>/dev/null | grep -E "ios-arm64[^/]*|MobileVLCKit\.framework$" | head -n 1 || true)"
            if [ -z "$VLC_FW" ]; then
              VLC_FW="$(find Pods -name "MobileVLCKit.framework" -type d 2>/dev/null | head -n 1 || true)"
            fi
            if [ -n "$VLC_FW" ] && [ -d "$VLC_FW" ]; then
              echo "==> Copiando MobileVLCKit.framework a Frameworks/..."
              rm -rf Frameworks/MobileVLCKit.framework
              cp -R "$VLC_FW" Frameworks/MobileVLCKit.framework
            fi
            cd ..
          fi

      - name: Build XaviTV.ipa with Xcode (iPhone & iPad Universal)
        run: |
          if [ -d "MiTV/iosApp" ]; then
            cd MiTV
          fi
          tr -d '\r' < iosApp/build_ipa.sh > iosApp/build_ipa.sh.lf && mv iosApp/build_ipa.sh.lf iosApp/build_ipa.sh
          chmod +x iosApp/build_ipa.sh
          cd iosApp
          ./build_ipa.sh

      - name: Upload XaviTV.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XaviTV-iOS-IPA
          path: |
            MiTV/iosApp/build/ipa/XaviTV.ipa
            iosApp/build/ipa/XaviTV.ipa
          if-no-files-found: error
